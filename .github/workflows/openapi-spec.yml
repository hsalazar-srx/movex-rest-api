name: OpenAPI Spec

on:
  push:
    paths:
      - "**/*.cs"
      - "**/*.json"
      - "**/*.csproj"
      - "scripts/generate-openapi.ps1"
      - "docs/openapi.json"
      - "Program.cs"
      - "Controllers/**"
  pull_request:
    paths:
      - "**/*.cs"
      - "**/*.json"
      - "**/*.csproj"
      - "scripts/generate-openapi.ps1"
      - "docs/openapi.json"
      - "Program.cs"
      - "Controllers/**"

jobs:
  generate-openapi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 7 runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Generate OpenAPI spec
        shell: pwsh
        run: |
          ./scripts/generate-openapi.ps1 -Configuration Release

      - name: Verify spec is up to date
        shell: pwsh
        run: |
          git status --porcelain
          if (git diff --name-only -- docs/openapi.json) {
            Write-Error "OpenAPI spec is out of date. Run scripts/generate-openapi.ps1 and commit the updated docs/openapi.json."
          }
